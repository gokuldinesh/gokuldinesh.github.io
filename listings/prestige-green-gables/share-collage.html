<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Share collage — Prestige Green Gables</title>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("fonts/cormorant-garamond-600.ttf") format("truetype");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("fonts/source-sans-3-400.ttf") format("truetype");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("fonts/source-sans-3-600.ttf") format("truetype");
      }

      /* Tokens — match listing light theme */
      :root {
        --listing-bg: #f5f0e6;
        --listing-bg-elevated: #f8f4ec;
        --listing-fg: #1c1b18;
        --listing-fg-secondary: #4a4740;
        --listing-accent: #1e4d3a;
        --gap: 5px;
        --pad: 16px;
        --radius: 4px;
        --footer-copy-top: 36px;
        /* Fixed canvas so browser preview matches PNG export */
        --size: 1080px;
        --font-listing-serif: "Cormorant Garamond", Georgia, serif;
        --font-listing-sans: "Source Sans 3", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1c1b18;
        font-family: var(--font-listing-sans);
        color: var(--listing-fg);
        -webkit-font-smoothing: antialiased;
      }

      /*
        3×3 grid: photo rows + slightly shorter footer.
        QR = one cell, right-aligned.
      */
      .collage {
        width: var(--size);
        height: var(--size);
        aspect-ratio: 1 / 1;
        padding: var(--pad);
        overflow: hidden;
        background:
          radial-gradient(
            120% 70% at 50% -10%,
            color-mix(in srgb, var(--listing-bg-elevated) 65%, var(--listing-bg)),
            var(--listing-bg) 58%
          );
      }

      .grid {
        height: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: auto auto 1fr;
        gap: var(--gap);
        min-height: 0;
      }

      .grid > * {
        min-width: 0;
        min-height: 0;
      }

      .grid figure {
        margin: 0;
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--listing-bg-elevated);
        aspect-ratio: 1 / 1;
      }

      .grid figure img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .copy {
        grid-column: 1 / span 2;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        height: 100%;
        min-height: 0;
        gap: 16px;
        padding: var(--footer-copy-top) 12px 28px;
        box-sizing: border-box;
      }

      .copy-primary {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        min-width: 0;
        min-height: 0;
      }

      .copy-head {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
      }

      .title {
        margin: 0 0 12px;
        font-family: var(--font-listing-serif);
        font-weight: 600;
        font-size: 62px;
        letter-spacing: -0.04em;
        line-height: 1;
        color: var(--listing-fg);
      }

      .meta {
        margin: 0 0 16px;
        font-family: var(--font-listing-sans);
        font-weight: 600;
        font-size: 34px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1;
        color: #4e3428;
      }

      .meta-sub {
        margin: 0;
        font-family: var(--font-listing-sans);
        font-weight: 400;
        font-size: 28px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        line-height: 1;
        color: var(--listing-fg-secondary);
      }

      .cta-block {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex-shrink: 0;
        min-width: 0;
      }

      .cta {
        margin: 0;
        font-family: var(--font-listing-sans);
        font-weight: 400;
        font-size: 22px;
        letter-spacing: 0.02em;
        line-height: 1;
        color: var(--listing-fg-secondary);
      }

      .cta-url {
        margin: 0;
        font-family: var(--font-listing-sans);
        font-weight: 400;
        font-size: 22px;
        letter-spacing: 0.01em;
        line-height: 1;
        color: #7a766e;
        word-break: break-all;
      }

      .qr {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        min-height: 0;
        align-self: stretch;
      }

      .qr img {
        height: 100%;
        width: auto;
        max-width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: contain;
        border-radius: var(--radius);
        display: block;
      }
    </style>
  </head>
  <body>
    <article class="collage" aria-label="Prestige Green Gables share collage">
      <div class="grid">
        <!-- Row 1 — pre-cropped square assets from photos/collage/ -->
        <figure>
          <img src="photos/collage/collage_1.jpeg" alt="Balcony" />
        </figure>
        <figure>
          <img src="photos/collage/collage_2.jpeg" alt="Kitchen" />
        </figure>
        <figure>
          <img src="photos/collage/collage_3.jpeg" alt="Pool" />
        </figure>
        <!-- Row 2 -->
        <figure>
          <img src="photos/collage/collage_4.jpeg" alt="Bedroom 1" />
        </figure>
        <figure>
          <img src="photos/collage/collage_5.jpeg" alt="Hall" />
        </figure>
        <figure>
          <img src="photos/collage/collage_6.jpeg" alt="Bedroom 2" />
        </figure>
        <!-- Row 3 = footer — copy synced from share-constants via export script -->
        <div class="copy">
          <div class="copy-primary">
            <div class="copy-head">
              <h1 class="title" data-collage="displayName">Prestige Green Gables</h1>
              <p class="meta" data-collage="meta"><span class="layout" data-collage="bedrooms">2 BHK</span> · ~1102 sft · 3rd floor</p>
              <p class="meta-sub" data-collage="metaSub">Outside-facing · Kadubeesanahalli</p>
            </div>
          </div>
          <div class="cta-block">
            <p class="cta" data-collage="visitCta">Full details & contact on the website</p>
            <p class="cta-url" data-collage="visitUrl">gokuldinesh.github.io/pages/prestige-green-gables/</p>
          </div>
        </div>
        <div class="qr">
          <img src="qr-listing.png" alt="QR code to listing" />
        </div>
      </div>
    </article>
  </body>
</html>
