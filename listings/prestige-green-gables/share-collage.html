<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Share collage — Prestige Green Gables</title>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("fonts/cormorant-garamond-600.ttf") format("truetype");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("fonts/source-sans-3-400.ttf") format("truetype");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("fonts/source-sans-3-600.ttf") format("truetype");
      }

      /* Tokens — match listing light theme */
      :root {
        --listing-bg: #f5f0e6;
        --listing-bg-elevated: #f8f4ec;
        --listing-fg: #1c1b18;
        --listing-fg-secondary: #4a4740;
        --listing-accent: #1e4d3a;
        --gap: 5px;
        --pad: 16px;
        --radius: 4px;
        /* Fixed canvas so browser preview matches PNG export */
        --size: 1080px;
        --font-listing-serif: "Cormorant Garamond", Georgia, serif;
        --font-listing-sans: "Source Sans 3", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1c1b18;
        font-family: var(--font-listing-sans);
        color: var(--listing-fg);
        -webkit-font-smoothing: antialiased;
      }

      /*
        3×3 grid: photo rows + slightly shorter footer.
        QR = one cell, right-aligned.
      */
      .collage {
        width: var(--size);
        height: var(--size);
        aspect-ratio: 1 / 1;
        padding: var(--pad);
        overflow: hidden;
        background:
          radial-gradient(
            120% 70% at 50% -10%,
            color-mix(in srgb, var(--listing-bg-elevated) 65%, var(--listing-bg)),
            var(--listing-bg) 58%
          );
      }

      .grid {
        height: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 1fr 1fr 0.86fr;
        gap: var(--gap);
        min-height: 0;
      }

      .grid > * {
        min-width: 0;
        min-height: 0;
      }

      .grid figure {
        margin: 0;
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--listing-bg-elevated);
      }

      .grid figure img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .pos-pool { object-position: 50% 72%; }
      .pos-hall { object-position: 18% 48%; }
      .pos-bed1 { object-position: 72% 42%; }
      .pos-kitchen { object-position: 48% 38%; }
      .pos-bed2 { object-position: 28% 45%; }
      .pos-balcony { object-position: 55% 40%; }

      .copy {
        grid-column: 1 / span 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: 14px;
        padding: 0 12px 0 12px;
        min-height: 0;
      }

      .title {
        margin: 0;
        font-family: var(--font-listing-serif);
        font-weight: 600;
        font-size: 66px;
        letter-spacing: -0.04em;
        line-height: 0.95;
        color: var(--listing-fg);
      }

      .meta {
        margin: 0;
        font-family: var(--font-listing-sans);
        font-weight: 600;
        font-size: 36px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1;
        color: #4e3428;
      }

      .meta-sub {
        margin: 0;
        font-family: var(--font-listing-sans);
        font-weight: 400;
        font-size: 30px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        line-height: 1;
        color: var(--listing-fg-secondary);
      }

      .rent {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        column-gap: 0.28em;
        font-family: var(--font-listing-sans);
        font-weight: 600;
        font-size: 40px;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
        line-height: 1;
        color: var(--listing-accent);
      }

      .rent .rent-suffix {
        font-weight: 400;
        font-size: 28px;
        letter-spacing: 0.01em;
        color: var(--listing-fg-secondary);
        margin-left: 0;
      }

      .qr {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        min-height: 0;
        align-self: stretch;
      }

      .qr img {
        height: 100%;
        width: auto;
        max-width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: contain;
        border-radius: var(--radius);
        display: block;
      }
    </style>
  </head>
  <body>
    <article class="collage" aria-label="Prestige Green Gables share collage">
      <div class="grid">
        <!-- Row 1 -->
        <figure>
          <img class="pos-balcony" src="photos/interior/balcony.jpg" alt="Balcony" />
        </figure>
        <figure>
          <img class="pos-kitchen" src="photos/interior/kitchen_1.jpg" alt="Kitchen" />
        </figure>
        <figure>
          <img class="pos-pool" src="photos/exterior/pool.jpg" alt="Pool" />
        </figure>
        <!-- Row 2 -->
        <figure>
          <img class="pos-bed1" src="photos/interior/bedroom-1_1.jpg" alt="Bedroom 1" />
        </figure>
        <figure>
          <img class="pos-hall" src="photos/interior/hall_1.jpg" alt="Hall" />
        </figure>
        <figure>
          <img class="pos-bed2" src="photos/interior/bedroom-2_1.jpg" alt="Bedroom 2" />
        </figure>
        <!-- Row 3 = footer — copy synced from share-constants via export script -->
        <div class="copy">
          <h1 class="title" data-collage="displayName">Prestige Green Gables</h1>
          <p class="meta" data-collage="meta"><span class="layout" data-collage="bedrooms">2 BHK</span> · ~1102 sft · 3rd floor</p>
          <p class="meta-sub" data-collage="metaSub">Outside-facing · Kadubeesanahalli</p>
          <p class="rent">
            <span data-collage="rent">₹70,000</span>
            <span class="rent-suffix" data-collage="rentSuffix">/ month · inc. maint.</span>
          </p>
        </div>
        <div class="qr">
          <img src="qr-listing.png" alt="QR code to listing" />
        </div>
      </div>
    </article>
  </body>
</html>
