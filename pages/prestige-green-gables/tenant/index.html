24\",null,{\"children\":[\"$\",\"$L25\",null,{\"slug\":\"prestige-green-gables\",\"seedListing\":{\"config\":{\"displayName\":\"Prestige Green Gables\",\"tagline\":\"Ease at hand, bright within, the city near — a 2 BHK for families.\",\"societyName\":\"Prestige Green Gables\",\"locality\":\"Kadubeesanahalli\",\"city\":\"Bengaluru\",\"availability\":\"available\",\"whatsappPhone\":\"917722047447\",\"whatsappEnquiryTemplate\":\"Hi, I saw the Prestige Green Gables 2 BHK listing in Kadubeesanahalli and would like to know more.\",\"contactEmail\":\"gokul.dinesh14@gmail.com\",\"navShortName\":\"Green Gables\",\"navAbbrevName\":\"PGG\",\"linkTitle\":\"2 BHK at Prestige Green Gables\",\"whatsappLink\":\"https://wa.me/917722047447?text=Hi%2C%20I%20saw%20the%20Prestige%20Green%20Gables%202%20BHK%20listing%20in%20Kadubeesanahalli%20and%20would%20like%20to%20know%20more.\"},\"overview\":{\"bedrooms\":\"2 BHK\",\"bathrooms\":\"2\",\"balcony\":\"1\",\"floor\":\"3rd floor\",\"facing\":\"Outside-facing\",\"parking\":\"1 covered parking\",\"highlights\":[\"Living \u0026 dining — TV unit and a north-facing balcony\",\"Modular kitchen with chimney and ample storage\",\"Wardrobes and dressing units in both bedrooms\",\"Geysers in both bathrooms\",\"Thoughtful fittings throughout\",\"Smart lock on the main door\",\"Full inverter backup\",\"MyGate-enabled apartment access\"]},\"rentalTerms\":{\"listedMonthlyRentInr\":70000,\"monthlyRentInr\":65000,\"depositInr\":130000,\"rentDueDay\":1,\"lateFeeGraceDays\":5,\"lateFeePerDayInr\":500,\"noticePeriodMonths\":2,\"maximumLeaseMonths\":11,\"lockInMonths\":6,\"annualRentIncreaseMaxPercent\":10,\"depositRefundDays\":30,\"maintenanceIncluded\":false,\"maintenanceRatePerSqFtInr\":5,\"maintenanceNote\":\"Society maintenance is not included in rent. The tenant pays it directly to the association as billed — currently about ₹5/sq ft before taxes.\",\"policeVerificationRequired\":true,\"petsAllowed\":false,\"smokingAllowed\":false,\"preferredTenants\":\"Families \u0026 couples\",\"leaseTermNote\":\"Open to renewal\",\"utilitiesNote\":\"Electricity (BESCOM), cooking gas, internet, and water charges (where billed separately) are paid directly by the tenant, and cleared before vacating.\",\"internetPolicy\":\"Internet is arranged and paid by the tenant; choose your own ISP.\",\"powerBackupNote\":\"Full inverter backup for lights, fans, sockets, and geysers during outages.\",\"advanceRentNote\":\"Due before possession, with the deposit. If move-in is on the 1st: full rent for that month and full rent for the final month of the lease. If move-in is after the 1st: prorated rent for the remaining days of the move-in month, full rent for the following month, and full rent for the final month of the lease.\",\"noticeRentNote\":\"Rent continues through the last day of occupancy, including the notice period.\",\"depositCapNote\":\"Refundable security deposit of two months’ rent, held separately and returned after handover — typically within 30 days. Unpaid dues (such as rent or electricity) and damage beyond normal wear may be deducted before refund.\",\"vacatingChargesNote\":\"At vacating, a fixed charge equal to one month’s rent covers deep cleaning, minor repairs, and painting. Major damage beyond normal wear is settled from the security deposit.\",\"inspectionAccessNote\":\"The owner or an authorised representative may visit during daytime hours with at least 24 hours’ prior notice (WhatsApp or email). During the notice period, viewings for prospective tenants are arranged at mutually agreed times.\",\"rentDefaultNote\":\"Rent is due on the 1st of each month, with a 5-day grace period. From the 6th, a late fee of ₹500 per day applies. Extended non-payment is handled as set out in the leave-and-licence agreement.\",\"alterationsNote\":\"No nailing or drilling into walls, tiles, or modular woodwork. Pictures, clocks, and light decor may be hung with removable sticky hooks or similar damage-free mounts. Structural changes require prior written approval. Temporary additions are removed on vacating, with the property restored to its prior condition.\",\"conductNote\":\"Residential use only. Society rules and quiet hours (typically after 10:00 PM) apply. Smoking is not allowed inside the flat, including balconies and utility areas. Subletting, short-stay letting, and commercial use of the address are not permitted.\",\"interiorCareNote\":\"The tenant keeps the interior clean and handles routine upkeep and minor repairs (such as bulbs or a small tap leak). Major plumbing or electrical faults should be reported promptly. Fair wear and tear is the owner’s responsibility; damage from misuse is the tenant’s.\",\"damageResponsibilityNote\":\"Normal wear and tear, building-level structural issues, and inherent structural leaks are the owner’s responsibility. Damage from misuse or negligence is repaired at the tenant’s expense.\",\"lockInNote\":\"There is a 6-month lock-in from commencement. Vacating during lock-in requires payment of rent for the remaining lock-in period. After lock-in, either party may end the licence with 2 months’ notice.\",\"tenantRequirements\":[\"Families \u0026 couples only — not bachelor or company leases\",\"Leave and licence for up to 11 months\",\"Police verification before move-in\",\"Residential use only — no subletting or commercial use\",\"Tenant pays electricity, gas, internet, and applicable water bills\",\"No pets\",\"No smoking inside the flat (including balconies and utility areas)\",\"Quiet household — society quiet hours and no nuisance to neighbours\"]},\"gallery\":[{\"id\":\"living\",\"title\":\"Living \u0026 dining\",\"images\":[{\"id\":\"hall-1\",\"alt\":\"Living and dining hall\",\"caption\":\"Hall\",\"src\":\"/listings/prestige-green-gables/photos/display/interior/hall_1.webp\",\"thumbSrc\":\"/listings/prestige-green-gables/photos/thumb/interior/hall_1.webp\",\"fullSrc\":\"/listings/prestige-green-gables/photos/interior/hall_1.jpg\"},{\"id\":\"hall-2\",\"alt\":\"Living and dining hall — second view\",\"caption\":\"Hall\",\"src\":\"/listings/prestige-green-gables/photos/display/interior/hall_2.webp\",\"thumbSrc\":\"/listings/prestige-green-gables/photos/thumb/interior/hall_2.webp\",\"fullSrc\":\"/listings/prestige-green-gables/photos/interior/hall_2.jpg\"}]},{\"id\":\"kitchen\",\"title\":\"Kitchen\",\"images\":[{\"id\":\"kitchen-1\",\"alt\":\"Modular kitchen\",\"caption\":\"Kitchen\",\"src\":\"/listings/prestige-green-gables/photos/display/interior/kitchen_1.webp\",\"thumbSrc\":\"/listings/prestige-green-gables/photos/thumb/interior/kitchen_1.webp\",\"fullSrc\":\"/listings/prestige-green-gables/photos/interior/kitchen_1.jpg\"},{\"id\":\"kitchen-2\",\"alt\":\"Kitchen detail\",\"caption\":\"Kitchen\",\"src\":\"/listings/prestige-green-gables/photos/display/interior/kitchen_2.webp\",\"thumbSrc\":\"/listings/prestige-green-gables/photos/thumb/interior/kitchen_2.webp\",\"fullSrc\":\"/listings/prestige-green-gables/photos/interior/kitchen_2.jpg\"}]},{\"id\":\"foyer\",\"title\":\"Foyer\",\"images\":[{\"id\":\"foyer-1\",\"alt\":\"Foyer entry\",\"caption\":\"Entry foyer\",\"src\":\"/listings/prestige-green-gables/photos/display/interior/foyer.webp\",\"thumbSrc\":\"/listings/prestige-green-gables/photos/thumb/interior/foyer.webp\",\"fullSrc\":\"/listings/prestige-green-gables/photos/interior/foyer.jpg\"}]},{\"id\":\"bedroom-1\",\"title\":\"Bedroom 1\",\"images\":[{\"id\":\"bedroom-1-1\",\"alt\":\"Bedroom 1\",\"caption\":\"Bedroom 1\",\"src\":\"/listings/prestige-green-gables/photos/display/interior/bedroom-1_1.webp\",\"thumbSrc\":\"/listings/prestige-green-gables/photos/thumb/interior/bedroom-1_1.webp\",\"fullSrc\":\"/listings/prestige-green-gables/photos/interior/bedroom-1_1.jpg\"},{\"id\":\"bedroom-1-2\",\"alt\":\"Bedroom 1 — second view\",\"caption\":\"Bedroom 1\",\"src\":\"/listings/prestige-green-gables/photos/display/interior/bedroom-1_2.webp\",\"thumbSrc\":\"/listings/prestige-green-gables/photos/thumb/interior/b ts in the hall; smart lock; wardrobes and dressing units in both bedrooms; geysers in both bathrooms; ceiling lights and fans; mosquito mesh on kitchen, bedroom, and balcony openings; curtain rods on bedroom windows and the hall French window. MyGate-enabled apartment access. Soft furnishings and appliances (fridge, washing machine, and similar) are not included unless agreed in writing — see the gallery for photos. Power backup and internet are covered under Policies.\"},{\"id\":\"lease\",\"question\":\"How long is the lease, and can it be renewed?\",\"answer\":\"Leave and licence for up to 11 months. Renewal is by mutual agreement; rent may increase by up to 10% over the last paid rent. There is a 6-month lock-in; after that, either party may end the tenancy with 2 months’ notice.\"},{\"id\":\"deposit\",\"question\":\"How does the deposit work?\",\"answer\":\"Refundable security deposit of two months’ rent, paid before move-in with advance rent. Held separately and returned after handover — typically within 30 days — once keys are returned and the flat is checked. Unpaid dues or damage beyond normal wear may be adjusted as set out in the agreement.\"}],\"amenities\":[\"Power backup\",\"24×7 security and CCTV\",\"Clubhouse with gym\",\"Swimming pool\",\"Indoor and outdoor sports\",\"Parks\",\"Visitor parking\",\"Hybrid society\"],\"furnishing\":[{\"id\":\"living\",\"title\":\"Living \u0026 dining\",\"items\":[\"TV unit with storage, open shelves, and strip lighting\",\"Puja unit with fluted glass accents\"]},{\"id\":\"kitchen\",\"title\":\"Kitchen\",\"items\":[\"Modular kitchen with chimney, lofts, glass-accent shutters, and strip lighting\",\"Tall unit with adjustable racks for containers and utility storage\",\"Open shelf, cutlery and plates pull-outs, and water-filter space at the sink\"]},{\"id\":\"foyer\",\"title\":\"Foyer\",\"items\":[\"Smart lock on main door — opens west\"]},{\"id\":\"bedroom-1\",\"title\":\"Bedroom 1\",\"items\":[\"Five-door wardrobe with
